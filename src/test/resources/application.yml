# 테스트는 외부 DB 없이 H2 메모리 DB(MySQL 호환 모드)로 실행합니다.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

cors:
  allowed-origins: http://localhost:5173

jwt:
  # 테스트 전용 값입니다. 운영·로컬 비밀키로 사용하지 마세요.
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbiEh
  access-token-validity: 1h
  refresh-token-validity: 14d

auth:
  refresh-cookie:
    path: /api/v1/auth/refresh
    secure: false
    same-site: Lax
