spring:
  application:
    name: server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # DB 접속 정보는 환경변수로 주입합니다. (값을 이 파일에 직접 쓰지 않음)
  # 로컬에서는 application-local.yml(커밋 금지)을 만들어 덮어써도 됩니다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

clova:
  ocr:
    invoke-url: ${CLOVA_OCR_INVOKE_URL:}
    secret-key: ${CLOVA_OCR_SECRET_KEY:}
    # 콘솔의 월 90회 제한보다 먼저 차단하는 애플리케이션 내부 안전 한도
    monthly-limit: ${CLOVA_OCR_MONTHLY_LIMIT:80}
