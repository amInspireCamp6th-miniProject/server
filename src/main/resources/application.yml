spring:
  application:
    name: server
  # DB 접속 정보는 환경변수로 주입합니다. (값을 이 파일에 직접 쓰지 않음)
  # 로컬에서는 application-local.yml(커밋 금지)을 만들어 덮어써도 됩니다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 테이블은 팀 공유 DDL 스크립트로 만든다. JPA는 테이블을 만들거나 바꾸지 않고,
      # 서버 시작 시 엔티티와 실제 테이블이 맞는지만 검사한다. (다르면 시작 실패)
      ddl-auto: validate

cors:
  # 브라우저 요청을 허용할 프론트엔드 주소. 여러 개면 쉼표로 구분한다.
  # 배포 환경에서는 환경변수 CORS_ALLOWED_ORIGINS로 덮어쓴다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  # Base64로 인코딩한 32바이트 이상의 비밀키. 환경변수 또는 application-local.yml로 주입합니다.
  secret: ${JWT_SECRET}
  access-token-validity: 24h
  # Refresh Token 유효 기간. 재발급할 때마다 새로 발급된다. (회전)
  refresh-token-validity: 14d

auth:
  refresh-cookie:
    # 재발급 API 경로와 같아야 한다. 이 경로의 요청에만 쿠키가 실린다.
    path: /api/v1/auth/refresh
    # 배포(HTTPS)에서는 true로 바꾼다. 로컬은 http라 true면 쿠키가 저장되지 않는다.
    secure: ${REFRESH_COOKIE_SECURE:false}
    # 프론트와 API가 다른 도메인이면 None으로 바꾼다. (이때 secure는 반드시 true)
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
